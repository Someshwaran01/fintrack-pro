name: Build Android APK

on:
  push:
    branches: [ Playstore ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: Playstore

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      # ─── Inject google-services.json from GitHub Secret ───────────────────
      # To set this up:
      # 1. Run: base64 -w 0 google-services.json   (on your local machine)
      # 2. Copy the output
      # 3. Go to GitHub → Settings → Secrets and variables → Actions
      # 4. Click "New repository secret"
      # 5. Name: GOOGLE_SERVICES_JSON   Value: (paste the base64 string)
      - name: Decode google-services.json
        run: |
          mkdir -p android/app
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json
        # This step will be skipped silently if the secret is not yet set.
        # Add the secret in GitHub when you're ready.

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fintrack-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
